<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Music Lava Lamp</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .controls {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        padding: 12px;
        border-radius: 12px;
        backdrop-filter: blur(20px);
      }

      input {
        color: white;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="controls">
      <input type="file" id="imageInput" accept="image/*" />
    </div>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .controls {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.45);
        padding: 12px;
        border-radius: 12px;
        backdrop-filter: blur(20px);
      }

      input {
        color: white;
      }
    </style>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const blobs = [];

      let mouseX = 0;
      let mouseY = 0;

      // window.addEventListener("mousemove", (e) => {
      //   mouseX = e.clientX / innerWidth - 0.5;
      //   mouseY = e.clientY / innerHeight - 0.5;
      // });

      function resize() {
        const dpr = window.devicePixelRatio || 1;

        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;

        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      resize();

      function createBlobTexture(color, size = 512) {
        const c = document.createElement("canvas");

        c.width = size;
        c.height = size;

        const x = c.getContext("2d");

        const gradient = x.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );

        gradient.addColorStop(0, color + "ff");
        gradient.addColorStop(0.5, color + "99");
        gradient.addColorStop(1, color + "00");

        x.fillStyle = gradient;
        x.fillRect(0, 0, size, size);

        return c;
      }

      function createBlobs(colors) {
        blobs.length = 0;

        const count =
          innerWidth < 768 ? 6 : Math.min(18, Math.floor(innerWidth / 180));

        for (let i = 0; i < count; i++) {
          const color = colors[i % colors.length];

          blobs.push({
            color,
            targetColor: color,

            texture: createBlobTexture(color),

            baseX: Math.random() * innerWidth,
            baseY: Math.random() * innerHeight,

            x: 0,
            y: 0,

            radius: 250 + Math.random() * 250,
            currentRadius: 300,

            orbitX: 150 + Math.random() * 500,
            orbitY: 150 + Math.random() * 500,

            phaseX: Math.random() * Math.PI * 2,
            phaseY: Math.random() * Math.PI * 2,

            speedX: 0.0001 + Math.random() * 0.0003,
            speedY: 0.0001 + Math.random() * 0.0003,

            pulsePhase: Math.random() * Math.PI * 2,
            pulseSpeed: 0.0003 + Math.random() * 0.0004,

            colorMix: 1,
          });
        }
      }

      function updatePalette(colors) {
        blobs.forEach((blob, i) => {
          blob.targetColor = colors[i % colors.length];
          blob.colorMix = 0;
        });
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function hexToRgb(hex) {
        return {
          r: parseInt(hex.slice(1, 3), 16),
          g: parseInt(hex.slice(3, 5), 16),
          b: parseInt(hex.slice(5, 7), 16),
        };
      }

      function blendHex(a, b, t) {
        const ca = hexToRgb(a);
        const cb = hexToRgb(b);

        return (
          "#" +
          [
            Math.round(lerp(ca.r, cb.r, t)),
            Math.round(lerp(ca.g, cb.g, t)),
            Math.round(lerp(ca.b, cb.b, t)),
          ]
            .map((v) => v.toString(16).padStart(2, "0"))
            .join("")
        );
      }

      let animationTime = 0;

      function updateBlobs(dt) {
        animationTime += dt;

        for (const blob of blobs) {
          blob.x =
            blob.baseX +
            Math.sin(animationTime * blob.speedX + blob.phaseX) * blob.orbitX;

          blob.y =
            blob.baseY +
            Math.cos(animationTime * blob.speedY + blob.phaseY) * blob.orbitY;

          blob.currentRadius =
            blob.radius +
            Math.sin(animationTime * blob.pulseSpeed + blob.pulsePhase) * 80;

          if (blob.color !== blob.targetColor) {
            blob.colorMix += dt * 0.0005;

            const t = Math.min(blob.colorMix, 1);

            const currentColor = blendHex(blob.color, blob.targetColor, t);

            blob.texture = createBlobTexture(currentColor);

            if (t >= 1) {
              blob.color = blob.targetColor;
            }
          }
        }
      }

      function draw(time) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);

        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, innerWidth, innerHeight);

        ctx.save();

        ctx.translate(mouseX * 40, mouseY * 40);

        ctx.translate(innerWidth / 2, innerHeight / 2);

        ctx.rotate(time * 0.00001);

        ctx.translate(-innerWidth / 2, -innerHeight / 2);

        ctx.globalCompositeOperation = "lighter";

        ctx.filter = innerWidth < 768 ? "blur(70px)" : "blur(100px)";

        for (const blob of blobs) {
          const r = blob.currentRadius;

          ctx.drawImage(blob.texture, blob.x - r, blob.y - r, r * 2, r * 2);
        }

        ctx.restore();

        ctx.filter = "none";

        ctx.fillStyle = "rgba(0,0,0,0.03)";

        ctx.fillRect(0, 0, innerWidth, innerHeight);
      }

      let lastTime = 0;

      function animate(time) {
        const dt = time - lastTime;
        lastTime = time;

        updateBlobs(dt);
        draw(time);

        requestAnimationFrame(animate);
      }

      function rgbToHex(r, g, b) {
        return (
          "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("")
        );
      }

      function extractColors(img) {
        const c = document.createElement("canvas");
        const x = c.getContext("2d");

        c.width = 150;
        c.height = 150;

        x.drawImage(img, 0, 0, 150, 150);

        const data = x.getImageData(0, 0, 150, 150).data;

        const map = {};

        for (let i = 0; i < data.length; i += 16) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);

          const saturation = max - min;
          const brightness = (r + g + b) / 3;

          // пропускаем серые, почти чёрные и почти белые
          if (saturation < 50 || brightness < 35 || brightness > 230) {
            continue;
          }

          const rr = Math.round(r / 24) * 24;
          const gg = Math.round(g / 24) * 24;
          const bb = Math.round(b / 24) * 24;

          const key = `${rr},${gg},${bb}`;

          map[key] = (map[key] || 0) + saturation;
        }

        let colors = Object.entries(map)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8)
          .map(([key]) => {
            const [r, g, b] = key.split(",").map(Number);

            return rgbToHex(r, g, b);
          });

        if (colors.length < 3) {
          colors = [
            "#ff3366",
            "#ff8800",
            "#00ccff",
            "#4466ff",
            "#aa00ff",
            "#00ffaa",
          ];
        }
        console.log(colors);
        return colors;
      }

      document.getElementById("imageInput").addEventListener("change", (e) => {
        const file = e.target.files[0];

        if (!file) return;

        const url = URL.createObjectURL(file);

        const img = new Image();

        img.onload = () => {
          const colors = extractColors(img);

          updatePalette(colors);

          URL.revokeObjectURL(url);
        };

        img.src = url;
      });

      createBlobs([
        "#ff3366",
        "#ff8800",
        "#ffcc00",
        "#00ccff",
        "#4466ff",
        "#aa00ff",
      ]);

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
